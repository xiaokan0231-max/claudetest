[project]
name = "sns-trend-lab-web"
version = "1.0.0"
description = "Local FastAPI web workspace for SNS Trend Lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["web_api/tests"]
pythonpath = ["."]
